<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Control de Entregas</title>
  <meta name="description" content="Control de Entregas y Almacén - Registro de despachos e ingresos con sincronización en tiempo real, catálogo de OPs y exportación a Excel" />
  <meta property="og:title" content="Control de Entregas" />
  <meta property="og:description" content="Control de Entregas y Almacén - Registro de despachos e ingresos con sincronización en tiempo real, catálogo de OPs y exportación a Excel" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A202C" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Entregas" />
  <script>
    window.__ip = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__ip = e;
      window.dispatchEvent(new CustomEvent('pwa-can-install'));
    });
    window.addEventListener('appinstalled', function () {
      window.__ip = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function (reg) {
            console.log('SW registrado correctamente, scope:', reg.scope);
          })
          .catch(function (e) {
            window.__swErr = String(e && e.message || e);
            console.warn('SW registro error:', e);
          });
      });
    }
  </script>
</body>
</html>
